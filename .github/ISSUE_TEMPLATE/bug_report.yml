name: Bug Report
description: Report a bug in firmware, RID Hub, or web configuration
title: "[BUG] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please fill in the sections below.

  - type: textarea
    id: description
    attributes:
      label: Bug description
      description: A clear and concise description of what the bug is.
      placeholder: Describe the bug...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can we reproduce this issue?
      placeholder: |
        1. Flash firmware to...
        2. Connect to AP...
        3. Open web config at...
        4. Set field X to Y
        5. See error Z
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Component affected
      options:
        - Firmware (ESP32)
        - RID Hub (desktop app)
        - Web configuration
        - Documentation
        - Build / CI
    validations:
      required: true

  - type: dropdown
    id: target
    attributes:
      label: Build target
      options:
        - esp32
        - esp32s3
        - esp32c6
    validations:
      required: true

  - type: dropdown
    id: protocol
    attributes:
      label: Protocol
      options:
        - MAVLink
        - MSP
        - NMEA
        - DroneCAN
        - None / system level
    validations:
      required: true

  - type: input
    id: firmware-version
    attributes:
      label: Firmware version
      description: "e.g. v1.0.0, nightly-abc1234"
      placeholder: "v1.0.0"
    validations:
      required: true

  - type: input
    id: hardware
    attributes:
      label: Hardware
      description: "ESP32 model, board, antenna, flight controller, GPS"
      placeholder: "ESP32-WROOM-32, generic dev board, PCB antenna, Pixhawk, BN-880"
    validations:
      required: false

  - type: textarea
    id: config
    attributes:
      label: Configuration
      description: "Paste your config JSON from /api/config if relevant"
      render: json
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Console output
      description: "Serial monitor or IDF monitor output"
      render: text
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Photos, wiring diagrams, or any other context.
    validations:
      required: false

  - type: checkboxes
    id: terms
    attributes:
      label: Checklist
      options:
        - label: I have searched existing issues to avoid duplicates
          required: true
        - label: I am using the latest main branch or a tagged release
          required: false
