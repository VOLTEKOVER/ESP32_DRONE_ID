name: RID Rust CI

on:
  push:
    branches: [ "main" ]
    paths:
      - 'OmniLink-REMOTE-ID/**'
      - '.github/workflows/rid-rust-ci.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'OmniLink-REMOTE-ID/**'
      - '.github/workflows/rid-rust-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} (${{ matrix.toolchain }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu: default gcc compiles the vendored C library.
          - os: ubuntu-latest
            toolchain: stable
          # Windows: the windows-gnu toolchain bundles MinGW gcc, required
          # because opendroneid.h is GCC-only (__attribute__((packed))); the
          # msvc target would fail to parse the header (see build.rs).
          - os: windows-latest
            toolchain: stable-x86_64-pc-windows-gnu

    defaults:
      run:
        working-directory: OmniLink-REMOTE-ID

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.toolchain }}
          components: clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: OmniLink-REMOTE-ID

      - name: Build (--locked)
        run: cargo build --workspace --locked

      - name: Test (--locked)
        run: cargo test --workspace --locked

      - name: Clippy (-D warnings)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
