name: OmniRID CI

on:
  push:
    branches: [ "main", "universal" ]
    paths:
      - 'OmniRID/**'
      - '.github/workflows/rid-rust-ci.yml'
  pull_request:
    branches: [ "main", "universal" ]
    paths:
      - 'OmniRID/**'
      - '.github/workflows/rid-rust-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} (${{ matrix.toolchain }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            toolchain: stable
          - os: windows-latest
            toolchain: stable-x86_64-pc-windows-gnu

    defaults:
      run:
        working-directory: OmniRID

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.toolchain }}
          components: clippy, rustfmt

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: OmniRID

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Build (--locked)
        run: cargo build --workspace --locked

      - name: Test (--locked)
        run: cargo test --workspace --locked

      - name: Clippy (-D warnings)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
