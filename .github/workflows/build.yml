name: Build Firmware

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - '**.md'
      - 'docs/images/**'
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  CCACHE_DIR: /root/.ccache

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v6.0.1
    strategy:
      fail-fast: false
      matrix:
        target:
          - esp32
          - esp32s3
          - esp32c6

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive

      - name: ccache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: /root/.ccache
          key: ccache-${{ matrix.target }}-${{ hashFiles('**/sdkconfig', '**/CMakeLists.txt', '**/*.cmake') }}
          restore-keys: |
            ccache-${{ matrix.target }}-
            ccache-

      - name: Set target and build
        run: |
          . /opt/esp/idf/export.sh > /dev/null 2>&1
          git config --global --add safe.directory "$(pwd)" > /dev/null 2>&1
          cd ESP32_DRONE_REMOTE_ID_Firmware
          idf.py set-target ${{ matrix.target }}
          export CCACHE_BASEDIR="$PWD"
          idf.py build
        shell: bash

      - name: Upload firmware artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: firmware-${{ matrix.target }}
          path: |
            ESP32_DRONE_REMOTE_ID_Firmware/build/bootloader/bootloader.bin
            ESP32_DRONE_REMOTE_ID_Firmware/build/partition_table/partition-table.bin
            ESP32_DRONE_REMOTE_ID_Firmware/build/esp-drone-remoteid.bin
          retention-days: 1
