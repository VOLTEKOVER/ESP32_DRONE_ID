name: ESP32 Cross-Build

on:
  push:
    branches: [ "main", "universal" ]
    paths:
      - 'OmniRID/**'
      - 'hardware/**'
      - '.github/workflows/esp32-build.yml'
  pull_request:
    branches: [ "main", "universal" ]
    paths:
      - 'OmniRID/**'
      - 'hardware/**'
      - '.github/workflows/esp32-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-checks:
    name: Host workspace (build/test/clippy)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: OmniRID

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c

      - name: Build host workspace (--locked)
        run: cargo build --workspace --locked

      - name: Test host workspace (--locked)
        run: cargo test --workspace --locked

      - name: Clippy host workspace (-D warnings)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  esp32-cross-build:
    name: ${{ matrix.chip }} cross-build
    needs: host-checks
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - chip: esp32
            feature: esp32
            target: xtensa-esp32-espidf
            espup_targets: esp32
            espup_riscv: "false"
          - chip: esp32s3
            feature: esp32s3
            target: xtensa-esp32s3-espidf
            espup_targets: esp32s3
            espup_riscv: "false"
          - chip: esp32c6
            feature: esp32c6
            target: riscv32imac-esp-espidf
            espup_targets: esp32c6
            espup_riscv: "true"

    defaults:
      run:
        working-directory: OmniRID

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c

      - name: Install espup
        run: cargo install espup

      - name: Install ESP-IDF Rust ecosystem
        run: |
          RISCV=""
          if [[ "${{ matrix.espup_riscv }}" == "true" ]]; then
            RISCV="-r"
          fi
          espup install --targets "${{ matrix.espup_targets }}" $RISCV

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: OmniRID
          key: ${{ matrix.chip }}

      - name: Cache ESP-IDF SDK
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        id: idf-cache
        with:
          path: |
            ~/.espressif
            ~/esp-idf
          key: esp-idf-${{ matrix.chip }}-${{ hashFiles('OmniRID/hardware/bsp-esp32/Cargo.toml') }}
          restore-keys: |
            esp-idf-${{ runner.os }}-
            esp-idf-${{ runner.os }}-

      - name: Cross-build bsp-esp32 for ${{ matrix.chip }}
        shell: bash
        working-directory: OmniRID/hardware/bsp-esp32
        run: |
          set -euo pipefail
          source "$HOME/export-esp.sh"
          # The *-espidf std targets are never precompiled: their standard
          # library is rebuilt from the rust-src component on every run.
          # Xtensa chips (esp32, esp32s3) build under the Espressif Rust fork
          # ("esp" toolchain); RISC-V (esp32c6) builds under stable.
          if [[ "${{ matrix.chip }}" == "esp32c6" ]]; then
            rustup component add rust-src --toolchain stable
            RUSTUP_TOOLCHAIN=stable
          else
            RUSTUP_TOOLCHAIN=esp
          fi
          export RUSTC_BOOTSTRAP=1
          export RUSTUP_TOOLCHAIN
          cargo build -Z build-std=std,panic_abort \
            --no-default-features \
            --features "${{ matrix.feature }},hardware" --target "${{ matrix.target }}"
