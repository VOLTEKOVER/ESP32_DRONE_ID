name: ESP32 Cross-Build

on:
  push:
    branches: [ "main", "universal" ]
    paths:
      - 'OmniRID/**'
      - 'hardware/**'
      - '.github/workflows/esp32-build.yml'
  pull_request:
    branches: [ "main", "universal" ]
    paths:
      - 'OmniRID/**'
      - 'hardware/**'
      - '.github/workflows/esp32-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-checks:
    name: Host workspace (build/test/clippy)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: OmniRID

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c

      - name: Build host workspace (--locked)
        run: cargo build --workspace --locked

      - name: Test host workspace (--locked)
        run: cargo test --workspace --locked

      - name: Clippy host workspace (-D warnings)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  esp32-cross-build:
    name: ${{ matrix.chip }} cross-build
    needs: host-checks
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - chip: esp32
            feature: esp32
            target: xtensa-esp32-espidf
          - chip: esp32s3
            feature: esp32s3
            target: xtensa-esp32s3-espidf
          - chip: esp32c6
            feature: esp32c6
            target: riscv32imac-esp-espidf

    defaults:
      run:
        working-directory: OmniRID

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c

      - name: Install espup
        run: cargo install espup

      - name: Install ESP-IDF Rust ecosystem
        run: espup install --targets esp32,esp32s3,esp32c6

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: OmniRID
          key: ${{ matrix.chip }}

      - name: Cache ESP-IDF SDK
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        id: idf-cache
        with:
          path: |
            ~/.espressif
            ~/esp-idf
          key: esp-idf-${{ matrix.chip }}-${{ hashFiles('OmniRID/hardware/bsp-esp32/Cargo.toml') }}
          restore-keys: |
            esp-idf-${{ runner.os }}-
            esp-idf-${{ runner.os }}-

      - name: Cross-build bsp-esp32 for ${{ matrix.chip }}
        shell: bash
        working-directory: OmniRID/hardware/bsp-esp32
        run: |
          set -euo pipefail
          # Xtensa chips (esp32, esp32s3) need the Espressif Rust fork ("esp"
          # toolchain), which ships the *-espidf targets with prebuilt std.
          if [[ "${{ matrix.chip }}" != "esp32c6" ]]; then
            source "$HOME/export-esp.sh"
            RUSTUP_TOOLCHAIN=esp \
              cargo build --features "${{ matrix.feature }},hardware" --target "${{ matrix.target }}"
            exit 0
          fi
          # RISC-V std builds (esp32c6) use the stable toolchain rebuilding
          # the standard library from source (RUSTC_BOOTSTRAP enables -Z on
          # stable). The espidf target is not preinstalled on stable.
          source "$HOME/export-esp.sh"
          rustup component add rust-src --toolchain stable
          RUSTUP_TOOLCHAIN=stable RUSTC_BOOTSTRAP=1 \
            cargo build -Z build-std=std,panic_abort \
            --features "${{ matrix.feature }},hardware" --target "${{ matrix.target }}"
