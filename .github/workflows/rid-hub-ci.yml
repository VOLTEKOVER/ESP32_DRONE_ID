name: RID Hub CI

on:
  push:
    branches: [ "main" ]
    paths:
      - 'RID_Hub/**'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'RID_Hub/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: RID Hub (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: RID_Hub/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: RID_Hub

      - name: Verify build (pack)
        run: npx electron-builder --dir
        working-directory: RID_Hub
