name: Update DroneCAN DSDL

on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  check:
    name: Check upstream DroneCAN DSDL
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch upstream DSDL
        run: |
          mkdir -p /tmp/dsdl-upstream
          curl -sL "https://raw.githubusercontent.com/DroneCAN/DSDL/master/uavcan/equipment/gnss/Fix2.uavcan" -o /tmp/dsdl-upstream/Fix2.uavcan

      - name: Compare with current parser
        id: compare
        run: |
          python3 << 'PYEOF'
          import re, sys

          with open("OmniRID/inputs/proto-dronecan/src/parser.rs") as f:
              current = f.read()

          with open("/tmp/dsdl-upstream/Fix2.uavcan") as f:
              dsdl = f.read()

          # Extract current DTID and signature
          dtid_match = re.search(r'const FIX2_DTID:\s*u16\s*=\s*(\d+);', current)
          sig_match = re.search(r'const FIX2_SIGNATURE:\s*u64\s*=\s*(0x[0-9a-fA-F]+);', current)

          current_dtid = int(dtid_match.group(1)) if dtid_match else None
          current_sig = sig_match.group(1) if sig_match else None

          # DSDL file changed if content differs from what we'd expect
          # For now, just report if upstream has changed struct fields
          field_count = len(re.findall(r'^\s+\w+\s+\w+', dsdl, re.MULTILINE))

          print(f"Current DTID: {current_dtid}")
          print(f"Current signature: {current_sig}")
          print(f"Upstream DSDL field count: {field_count}")
          print(f"Upstream DSDL size: {len(dsdl)} bytes")

          # Store for PR body
          with open("/tmp/dsdl-info.txt", "w") as f:
              f.write(f"DTID: {current_dtid}\n")
              f.write(f"Signature: {current_sig}\n")
              f.write(f"Fields: {field_count}\n")
              f.write(f"Size: {len(dsdl)} bytes\n")

          # Check if the DSDL content has changed by comparing with a known hash
          import hashlib
          content_hash = hashlib.sha256(dsdl.encode()).hexdigest()[:16]
          print(f"DSDL hash: {content_hash}")

          # Store hash for comparison
          with open("/tmp/dsdl-hash.txt", "w") as f:
              f.write(content_hash)
          PYEOF

      - name: Create issue if DSDL changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Check if we already have an open issue for this
          EXISTING=$(gh issue list --label "dronecan-update" --state open --json number --jq '.[0].number // empty')

          if [ -n "$EXISTING" ]; then
            echo "Issue #$EXISTING already exists for DroneCAN update"
            exit 0
          fi

          # Create a tracking issue
          INFO=$(cat /tmp/dsdl-info.txt)
          HASH=$(cat /tmp/dsdl-hash.txt)

          gh issue create \
            --title "DroneCAN DSDL upstream changed (Fix2)" \
            --label "dronecan-update" \
            --body "## DroneCAN DSDL Upstream Change Detected

The \`uavcan.equipment.gnss.Fix2\` DSDL definition may have changed upstream.

### Current parser values:
\`\`\`
$INFO
\`\`\`

### Action required:
1. Check https://github.com/DroneCAN/DSDL/blob/master/uavcan/equipment/gnss/Fix2.uavcan for field changes
2. If struct layout changed, update \`OmniRID/inputs/proto-dronecan/src/parser.rs\` bit offsets
3. Run \`cargo test --workspace\` to verify

### DSDL content hash: \`$HASH\`"

          echo "Created tracking issue for DroneCAN DSDL change"
