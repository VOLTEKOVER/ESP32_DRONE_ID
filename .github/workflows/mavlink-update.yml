name: Update MAVLink dialects

on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  check:
    name: Check upstream MAVLink
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch upstream MAVLink XML
        run: |
          mkdir -p /tmp/mavlink-upstream
          curl -sL "https://raw.githubusercontent.com/mavlink/mavlink/master/message_definitions/v1.0/common.xml" -o /tmp/mavlink-upstream/common.xml
          curl -sL "https://raw.githubusercontent.com/mavlink/mavlink/master/message_definitions/v1.0/ardupilotmega.xml" -o /tmp/mavlink-upstream/ardupilotmega.xml
          curl -sL "https://raw.githubusercontent.com/mavlink/mavlink/master/message_definitions/v1.0/opendroneid.xml" -o /tmp/mavlink-upstream/opendroneid.xml

      - name: Extract message IDs and CRC extras
        run: |
          python3 << 'PYEOF'
          import xml.etree.ElementTree as ET
          import json, sys

          msgs = {}
          for f in ["common.xml", "ardupilotmega.xml", "opendroneid.xml"]:
              try:
                  tree = ET.parse(f"/tmp/mavlink-upstream/{f}")
                  for msg in tree.iter("message"):
                      name = msg.get("name", "")
                      msgid = msg.get("id", "")
                      if name and msgid:
                          # Compute CRC extra from field types
                          crc_extra = msg.get("crc_extra", "0")
                          msgs[name] = {"id": int(msgid), "crc_extra": int(crc_extra)}
              except Exception as e:
                  print(f"Warning: failed to parse {f}: {e}", file=sys.stderr)

          with open("/tmp/mavlink-upstream/messages.json", "w") as f:
              json.dump(msgs, f, indent=2)

          print(f"Extracted {len(msgs)} messages from upstream XML")
          PYEOF

      - name: Compare with hardcoded values
        id: compare
        run: |
          python3 << 'PYEOF'
          import json, re, sys

          with open("/tmp/mavlink-upstream/messages.json") as f:
              upstream = json.load(f)

          # Read current parser
          with open("OmniRID/inputs/proto-mavlink/src/parser.rs") as f:
              current = f.read()

          # Extract current MSG_ID constants
          current_ids = {}
          for m in re.finditer(r'const (MSG_ID_\w+):\s*u32\s*=\s*(\d+);', current):
              current_ids[m.group(1)] = int(m.group(2))

          # Map upstream names to our constant names
          changes = []
          for name, info in upstream.items():
              const_name = f"MSG_ID_{name}"
              if const_name in current_ids:
                  if current_ids[const_name] != info["id"]:
                      changes.append(f"  {const_name}: {current_ids[const_name]} -> {info['id']}")

          if changes:
              print(f"CHANGED={len(changes)}")
              print("Changes detected:")
              for c in changes:
                  print(c)
              with open("/tmp/mavlink-changes.txt", "w") as f:
                  f.write("\n".join(changes))
          else:
              print("NO_CHANGES")
          PYEOF

      - name: Create PR if changes detected
        if: steps.compare.outputs.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RESULT=$(python3 << 'PYEOF'
          import json, re, sys

          with open("/tmp/mavlink-upstream/messages.json") as f:
              upstream = json.load(f)

          with open("OmniRID/inputs/proto-mavlink/src/parser.rs") as f:
              current = f.read()

          current_ids = {}
          for m in re.finditer(r'const (MSG_ID_\w+):\s*u32\s*=\s*(\d+);', current):
              current_ids[m.group(1)] = int(m.group(2))

          changes = []
          for name, info in upstream.items():
              const_name = f"MSG_ID_{name}"
              if const_name in current_ids and current_ids[const_name] != info["id"]:
                  changes.append((const_name, current_ids[const_name], info["id"]))

          if not changes:
              print("NO_CHANGES")
              sys.exit(0)

          # Apply changes
          new_content = current
          for const_name, old_id, new_id in changes:
              new_content = new_content.replace(
                  f"const {const_name}: u32 = {old_id};",
                  f"const {const_name}: u32 = {new_id};"
              )

          with open("OmniRID/inputs/proto-mavlink/src/parser.rs", "w") as f:
              f.write(new_content)

          print(f"CHANGED={len(changes)}")
          for c in changes:
              print(f"  {c[0]}: {c[1]} -> {c[2]}")
          PYEOF
          )

          if echo "$RESULT" | head -1 | grep -q "NO_CHANGES"; then
            echo "No message ID changes detected"
            exit 0
          fi

          BRANCH="ci/mavlink-update-$(date +%Y%m%d)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add OmniRID/inputs/proto-mavlink/src/parser.rs
          git commit -m "chore(proto-mavlink): update message IDs from upstream MAVLink

Updated message ID constants from latest upstream MAVLink XML specs.
Changes:
$RESULT"

          git push origin "$BRANCH"
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "Update MAVLink message IDs from upstream" \
            --body "Automated update of MAVLink message ID constants from upstream XML specs.

Message IDs that changed:
\`\`\`
$RESULT
\`\`\`

Please verify the CRC extras and field decoders still match the updated messages."
