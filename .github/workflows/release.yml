name: Release RID Hub

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-ridhub-windows:
    name: RID Hub (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci
        working-directory: RID_Hub

      - name: Build Windows installer
        run: npx electron-builder --win --publish never
        working-directory: RID_Hub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ridhub-windows
          path: RID_Hub/release/*.exe
          retention-days: 30

  build-ridhub-linux:
    name: RID Hub (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci
        working-directory: RID_Hub

      - name: Build Linux AppImage
        run: npx electron-builder --linux --publish never
        working-directory: RID_Hub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Linux artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ridhub-linux
          path: RID_Hub/release/*.AppImage
          retention-days: 30

  create-release:
    name: Create Release
    needs: [build-ridhub-windows, build-ridhub-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Download RID Hub artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          path: artifacts
          pattern: ridhub-*

      - name: Get version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV
        shell: bash

      - name: Prepare release assets
        run: |
          mkdir -p release
          for dir in artifacts/ridhub-*/; do
            [ -d "$dir" ] || continue
            cp -r "$dir"* release/
          done
        shell: bash

      - name: Generate release notes
        run: |
          VERSION=${{ env.VERSION }}

          cat > release-notes.md << EOF
          # OmniRID v${VERSION}

Open DroneID transmitter for ESP32 -- ASTM F3411-22a / ASD-STAN prEN 4709-002.

Written in Rust. Firmware builds via \`cargo +esp build\` (see CI).

          ## Downloads

          | File | Platform |
          |------|----------|
          | \`RID Hub Setup $VERSION.exe\` | Windows desktop app |
          | \`RID Hub $VERSION.AppImage\` | Linux desktop app |
          EOF

          echo "" >> release-notes.md
          echo "## What's Changed" >> release-notes.md

          PREV=$(git tag --sort=-version:refname | head -2 | tail -1)
          if [ -z "$PREV" ]; then
            echo "" >> release-notes.md
            echo "*(initial release)*" >> release-notes.md
          else
            echo "" >> release-notes.md
            git log "$PREV.." --format="  - %s" >> release-notes.md || true
          fi

          echo "" >> release-notes.md
          echo "---" >> release-notes.md
          echo "Full documentation at https://VOLTEKOVER.github.io/ESP_DRONE_REMOTEID/" >> release-notes.md
        shell: bash

      - name: Create Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228
        with:
          name: OmniRID v${{ env.VERSION }}
          body_path: release-notes.md
          files: |
            release/*.exe
            release/*.AppImage

      - name: Prepare Pages deploy
        run: |
          mkdir -p docs/images
        shell: bash

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: docs
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
